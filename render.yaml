services:
  - type: web
    name: statippica
    runtime: node
    region: frankfurt
    plan: free
    # L'archivio viaggia compresso: da aperto supera i 100 MB che GitHub
    # accetta per un singolo file, da compresso sta in meno di 30.
    #
    # Va riaperto nella cartella del progetto, NON sul disco montato: il
    # server apre data.db relativo alla cartella di lavoro (server/routes.ts,
    # DB_PATH = cwd + "data.db"). Riaprirlo altrove lascia il sito senza
    # archivio e ogni richiesta risponde "unable to open database file".
    buildCommand: npm install && npm run build && gunzip -c data.db.gz > data.db && ls -l data.db
    startCommand: NODE_ENV=production node dist/index.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER
        value: "true"
      - key: PORT
        value: "10000"
    disk:
      name: statippica-data
      mountPath: /data
      sizeGB: 1
