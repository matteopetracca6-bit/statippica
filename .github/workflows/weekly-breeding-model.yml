name: StatIppica — Weekly Breeding Model (retraining)
on:
  # Ogni domenica alle 04:30 UTC — dopo che i job notturni hanno aggiornato i dati.
  # Settimanale, non giornaliero: il modello cambia poco giorno per giorno,
  # ritrainarlo ogni notte sarebbe spreco.
  schedule:
    - cron: "30 4 * * 0"
  workflow_dispatch: {}
jobs:
  train:
    name: Addestra breeding_model.json
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installa dipendenze
        run: pip install scikit-learn numpy
      - name: Riapri l'archivio compresso
        # In git sta solo data.db.gz: il file aperto e' escluso perche' da
        # aperto supera i 100 MB che GitHub accetta per un singolo file.
        # Va riaperto QUI, prima di lavorarci. Senza questo passo
        # sqlite3.connect("data.db") non fallisce: crea un archivio VUOTO,
        # il lavoro notturno gira sul nulla e alla fine sovrascrive
        # data.db.gz con un archivio vuoto, che finisce pubblicato.
        run: |
          set -euo pipefail
          if [ ! -f data.db.gz ]; then
            echo "::error::data.db.gz non presente nel repo: mi fermo."
            exit 1
          fi
          gunzip -c data.db.gz > data.db
          # Un archivio vero pesa quasi 100 MB e ha centinaia di migliaia di
          # gare. Se dopo la riapertura e' minuscolo o illeggibile, qualcosa
          # e' andato storto e fermarsi ora e' molto meglio che pubblicare.
          BYTE=$(stat -c%s data.db)
          echo "Archivio riaperto: $BYTE byte"
          if [ "$BYTE" -lt 20000000 ]; then
            echo "::error::archivio sospettosamente piccolo ($BYTE byte): mi fermo."
            exit 1
          fi
          GARE=$(python -c "import sqlite3;print(sqlite3.connect('data.db').execute('select count(*) from races').fetchone()[0])")
          echo "Gare in archivio: $GARE"
          if [ "$GARE" -lt 500000 ]; then
            echo "::error::solo $GARE gare in archivio, me ne aspetto oltre 500000: mi fermo."
            exit 1
          fi
      - name: Addestra il modello
        env:
          DB_PATH: data.db
        run: python train_breeding_model.py
      - name: Commit e push del modello
        run: |
          git config user.email "nightly@statippica.bot"
          git config user.name "StatIppica Breeding Trainer"
          git remote set-url origin "https://matteopetracca6-bit:${{ secrets.GH_NIGHTLY_TOKEN }}@github.com/matteopetracca6-bit/statippica.git"
          # Il report di validazione va versionato insieme al modello: il server e la
          # documentazione lo usano per dire se il modello e' utilizzabile o solo
          # sperimentale. Senza, resterebbe pubblicato un report vecchio e non coerente.
          git add breeding_model.json breeding_eval_report.json
          git commit -m "breeding model retrain $(date -u '+%Y-%m-%d')" || echo "nessuna modifica"
          git push origin main || echo "push saltato"
      - name: Trigger deploy Render
        if: success()
        run: |
          sleep 15
          # La risposta di Render non e' sempre JSON (errore HTML, rate limit, 5xx).
          # Con json.load diretto il passo andava in JSONDecodeError e faceva
          # fallire l'intero job DOPO che i dati erano gia' stati salvati e
          # committati: un allarme falso che nasconde i fallimenti veri.
          # Ora il deploy non confermato e' un warning, non un errore.
          RESP=$(curl -s -m 60 -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://api.render.com/v1/services/srv-d92cpfm7r5hc73fe07ig/deploys" || true)
          DEPLOY_ID=$(echo "$RESP" | sed -n 's/.*"id"[: ]*"\([^"]*\)".*/\1/p' | head -1)
          if [ -n "$DEPLOY_ID" ]; then
            echo "Deploy Render avviato: $DEPLOY_ID"
          else
            echo "::warning::Render non ha confermato il deploy. Risposta: $(echo "$RESP" | head -c 200)"
          fi
