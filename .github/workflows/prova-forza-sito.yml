name: PROVA — scheda UNIRE anno per anno
on:
  push:
    branches: [prova/forza-sito]
permissions:
  contents: write
jobs:
  guarda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scarica due schede UNIRE
        run: |
          for id in 607458 625679; do
            curl -s -m 60 "https://www.unire.it/index.php/ita/trotto/list?id_cav=$id" -o scheda_$id.html
            sleep 2
            python3 - "$id" <<'PY'
          import re, sys, html
          t = open(f"scheda_{sys.argv[1]}.html", encoding="utf-8", errors="ignore").read()
          testo = re.sub(r"<[^>]+>", " ", t); testo = html.unescape(re.sub(r"\s+", " ", testo))
          i = testo.find("La scheda")
          print(testo[i:i+3000])
          PY
          done
      - uses: actions/checkout@v5
        with:
          path: repo
      - name: Salva su un ramo
        run: |
          cd repo
          git checkout -q --orphan prova/forza-foto
          git rm -rq . || true
          cp ../scheda_*.html .
          git add scheda_*.html
          git -c user.name=prova -c user.email=prova@example.com commit -qm schede
          git push -qf origin prova/forza-foto
