name: PROVA — foto scheda
on:
  push:
    branches: [prova/forza-sito]
permissions:
  contents: write
jobs:
  foto:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Prepara
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Aspetta il deploy nuovo e fotografa
        run: |
          cat > foto.py <<'PY'
          import time
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch()
              pg = b.new_page(viewport={"width": 1400, "height": 1000})
              for i in range(40):
                  pg.goto("https://statippica.onrender.com/#/pedigree", timeout=120000)
                  try:
                      pg.wait_for_selector("text=Trisavoli", timeout=40000)
                      break
                  except Exception:
                      print("non ancora", i); time.sleep(30)
              pg.get_by_text("Scegli un cavallo dall'elenco").first.click()
              pg.keyboard.type("CHICCA ROSS", delay=60)
              time.sleep(4)
              pg.locator("li, button, [role=option]").filter(has_text="CHICCA ROSS").first.click()
              pg.wait_for_selector("text=Bisnonni", timeout=120000)
              time.sleep(5)
              pg.screenshot(path="foto2.png", full_page=True)
              pg.goto("https://statippica.onrender.com/#/horse/CHICCA%20ROSS/2018", timeout=120000)
              pg.evaluate("localStorage.setItem('scheda-cavallo-sezione-famiglia','1')")
              pg.reload(timeout=120000)
              pg.wait_for_selector("#sez-genealogia >> text=Nonni", timeout=120000)
              time.sleep(4)
              el = pg.locator("#sez-genealogia")
              el.scroll_into_view_if_needed()
              el.screenshot(path="foto1.png")
              b.close()
          PY
          python foto.py
          ls -la foto*.png
      - uses: actions/checkout@v5
        with:
          path: repo
      - name: Salva
        run: |
          cd repo
          git checkout -q --orphan prova/forza-foto
          git rm -rqf . || true
          cp ../foto*.png .
          git add foto*.png
          git -c user.name=prova -c user.email=prova@example.com commit -qm foto
          git push -qf origin prova/forza-foto
