name: PROVA — storici UNIRE
on:
  push:
    branches: [feature/storici-unire]
permissions:
  contents: read
  actions: read
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4
      - name: Procura l'archivio
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ottieni_archivio.sh
      - run: python3 scripts/storici_unire.py --db data.db --minuti 10 --prova
