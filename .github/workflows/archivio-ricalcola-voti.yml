name: StatIppica — Ricalcola i voti (a mano)

# Ricalcola subito i voti di cavalli, storici, stalloni e fattrici e pubblica
# l'archivio aggiornato, senza aspettare il lavoro notturno.
#
# Nato a ottobre 2026, quando la continuita' ha smesso di contare le stagioni
# dopo i 7 anni: senza questo flusso il sito avrebbe mostrato i voti vecchi
# fino alla notte. Serve ogni volta che cambia il modo di calcolare il voto.

on:
  workflow_dispatch:
    inputs:
      prova:
        description: "Solo prova, senza pubblicare niente"
        type: boolean
        required: false
        default: false

permissions:
  contents: write # serve per pubblicare l'archivio aggiornato nel rilascio
  actions: read # serve per vedere se un altro lavoro sta gia' pubblicando

jobs:
  ricalcola:
    runs-on: ubuntu-latest
    name: Ricalcola i voti e pubblica
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: pip install requests beautifulsoup4 numpy pandas

      - name: Procura l'archivio
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ottieni_archivio.sh

      - name: Ricalcola i voti
        env:
          DB_PATH: data.db
        run: |
          python3 - <<'PY'
          import importlib.util, sqlite3
          spec = importlib.util.spec_from_file_location("nu", "nightly_update.py")
          nu = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(nu)

          conn = sqlite3.connect("data.db")
          nu.init_db(conn)
          nu.phase_ratings(conn)            # voti dei cavalli
          nu.phase_historic_ratings(conn)   # classifica storica
          nu.phase_stallion_ratings(conn)   # stalloni, giudicati sui figli
          nu.phase_dam_ratings(conn)        # fattrici, giudicate sui figli
          conn.commit()
          nu.phase_grade_stability(conn)    # affidabilita' del voto per eta'
          conn.commit()
          conn.close()
          PY

      - name: Controlla il risultato
        run: |
          python3 - <<'PY'
          import sqlite3, sys
          c = sqlite3.connect('data.db')
          n = c.execute("SELECT COUNT(*) FROM horse_ratings WHERE rating_mode='performance'").fetchone()[0]
          print(f"cavalli con un voto: {n}")
          if n < 10000:
              print("::error::troppo pochi cavalli con un voto: non pubblico.")
              sys.exit(1)
          # Il caso da cui e' nato il cambio: 6 stagioni dai 2 ai 7 anni su 6.
          r = c.execute("SELECT stagioni_corse, stagioni_possibili, integrita_percentile, grade FROM horse_ratings WHERE name='UNE ETOILE GAR'").fetchone()
          print("UNE ETOILE GAR:", r)
          if r and r[1] != 6:
              print("::error::le stagioni possibili non sono contate fino ai 7 anni.")
              sys.exit(1)
          oltre = c.execute("SELECT COUNT(*) FROM horse_ratings WHERE integrita_percentile > 100").fetchone()[0]
          if oltre:
              print(f"::error::{oltre} cavalli con continuita' oltre 100.")
              sys.exit(1)
          for g, in c.execute("SELECT DISTINCT grade FROM horse_ratings WHERE rating_mode='performance' ORDER BY grade"):
              print(" ", g, c.execute("SELECT COUNT(*) FROM horse_ratings WHERE rating_mode='performance' AND grade=?", (g,)).fetchone()[0])
          print("Tutto coerente.")
          PY

      - name: Pubblica l'archivio aggiornato
        if: ${{ inputs.prova != true }}
        env:
          GH_TOKEN: ${{ secrets.GH_NIGHTLY_TOKEN }}
        run: |
          set -euo pipefail
          GARE=$(python3 -c "import sqlite3;print(sqlite3.connect('data.db').execute('select count(*) from races').fetchone()[0])")
          echo "Gare nell'archivio da pubblicare: $GARE"
          if [ "$GARE" -lt 500000 ]; then
            echo "::error::solo $GARE gare: non lo pubblico."
            exit 1
          fi
          gzip -9 -c data.db > data.db.gz
          ls -l data.db.gz
          bash scripts/pubblica_archivio.sh
          echo "Archivio aggiornato pubblicato."

      - name: Chiedi a Render di ripubblicare il sito
        if: ${{ success() && inputs.prova != true }}
        run: |
          sleep 10
          curl -s -m 60 -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/srv-d92cpfm7r5hc73fe07ig/deploys" \
            -d '{}' | head -c 300
          echo
