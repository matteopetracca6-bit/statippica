name: StatIppica — Forza e curva di carriera (a mano)

# Novembre 2026 (forza.py). Calcola subito forza, stagioni e curva di
# carriera di tutti i cavalli, rifa' la verifica, pubblica l'archivio e
# ripubblica il sito. Ogni notte lo stesso calcolo gira dentro il notturno
# (senza la verifica, che si rifa' da qui).

on:
  workflow_dispatch:
    inputs:
      prova:
        description: "Solo prova, senza pubblicare niente"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: read

jobs:
  forza:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Installa dipendenze
        run: pip install numpy pandas scikit-learn
      - name: Procura l'archivio
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ottieni_archivio.sh
      - name: Calcola forza, curve e verifica
        run: |
          python3 forza.py --db data.db --verifica
          python3 - <<'PY'
          import sqlite3
          c = sqlite3.connect("data.db")
          for t in ("forza_cavallo", "forza_stagioni", "curva_carriera"):
              print(t, c.execute(f"SELECT COUNT(*) FROM {t}").fetchone()[0])
          print("CHICCA ROSS", c.execute("SELECT forza, ferma, potenziale, potenziale_eta, picco, picco_eta FROM forza_cavallo WHERE horse_name='CHICCA ROSS'").fetchone())
          print("  stagioni", c.execute("SELECT eta, forza, corse FROM forza_stagioni WHERE horse_name='CHICCA ROSS' ORDER BY eta").fetchall())
          PY
      - name: Pubblica l'archivio aggiornato
        if: ${{ inputs.prova != true }}
        env:
          GH_TOKEN: ${{ secrets.GH_NIGHTLY_TOKEN }}
        run: |
          set -euo pipefail
          GARE=$(python3 -c "import sqlite3;print(sqlite3.connect('data.db').execute('select count(*) from races').fetchone()[0])")
          if [ "$GARE" -lt 500000 ]; then echo "::error::solo $GARE gare: non lo pubblico."; exit 1; fi
          gzip -9 -c data.db > data.db.gz
          bash scripts/pubblica_archivio.sh
      - name: Chiedi a Render di ripubblicare il sito
        if: ${{ success() && inputs.prova != true }}
        run: |
          sleep 10
          curl -s -m 60 -X POST -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" -d '{}' \
            "https://api.render.com/v1/services/srv-d92cpfm7r5hc73fe07ig/deploys" | head -c 300; echo
