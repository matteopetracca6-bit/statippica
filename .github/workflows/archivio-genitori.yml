name: StatIppica — Madri mancanti e sesso (a mano)

# 23/11/2026 (scripts/completa_genitori.py). Mette le madri che mancavano
# (TRIXTON usciva "MUSCLE HILL x ???"), unisce i nomi con la sigla del paese
# ("TRIXTON -USA-") e il sesso vuoto, poi pubblica l'archivio. Lo fa anche il
# notturno: questo serve a non aspettare la notte. Da lanciare solo fuori
# dalle ore dei lavori notturni (23-09).

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  genitori:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Procura l'archivio
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ottieni_archivio.sh
      - name: Calcola
        run: |
          pip install -q requests beautifulsoup4
          python3 scripts/ripara_corse.py --db data.db
          python3 scripts/completa_genitori.py --db data.db
          python3 scripts/omonimi_unire.py --db data.db --minuti 60 || echo "::warning::omonimi da UNIRE non fatti"
      - name: Ricalcola voti (carriere senza le copie, figli al genitore giusto)
        run: |
          pip install numpy pandas >/dev/null 2>&1 || true
          python3 - <<'PY' || echo "::warning::voti non ricalcolati: li rifa' il notturno"
          import importlib.util, sqlite3
          spec = importlib.util.spec_from_file_location("nu", "nightly_update.py")
          nu = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(nu)
          conn = sqlite3.connect("data.db")
          nu.phase_ratings(conn)
          nu.phase_historic_ratings(conn)
          nu.phase_stallion_ratings(conn)
          nu.phase_dam_ratings(conn)
          nu.phase_voti_pedigree(conn)
          conn.commit()
          conn.close()
          PY
      - name: Pubblica l'archivio aggiornato
        env:
          GH_TOKEN: ${{ secrets.GH_NIGHTLY_TOKEN }}
        run: |
          set -euo pipefail
          GARE=$(python3 -c "import sqlite3;print(sqlite3.connect('data.db').execute('select count(*) from races').fetchone()[0])")
          if [ "$GARE" -lt 500000 ]; then echo "::error::solo $GARE gare: non lo pubblico."; exit 1; fi
          gzip -9 -c data.db > data.db.gz
          bash scripts/pubblica_archivio.sh
