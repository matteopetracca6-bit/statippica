name: StatIppica — Pedigree (test)
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Quanti record processare per fase (test piccolo consigliato: 10)"
        required: false
        default: "10"
      no_push:
        description: "Non salvare su GitHub (solo test, true/false)"
        required: false
        default: "true"
jobs:
  fill-pedigree:
    name: Esegui fill_pedigree.py
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installa dipendenze
        run: pip install requests beautifulsoup4
      - name: Esegui fill_pedigree.py
        env:
          DB_PATH: data.db
          REPO_DB_PATH: data.db
          GITHUB_TOKEN: ${{ secrets.GH_NIGHTLY_TOKEN }}
          GITHUB_USER: matteopetracca6-bit
          GITHUB_REPO: statippica
        run: |
          ARGS="--limit ${{ inputs.limit }}"
          if [ "${{ inputs.no_push }}" = "true" ]; then
            ARGS="$ARGS --no-push"
          fi
          echo "Eseguo: python fill_pedigree.py $ARGS"
          python fill_pedigree.py $ARGS
      - name: Trigger deploy Render (solo se ha salvato davvero)
        if: success() && inputs.no_push != 'true'
        run: |
          sleep 15
          # La risposta di Render non e' sempre JSON (errore HTML, rate limit, 5xx).
          # Con json.load diretto il passo andava in JSONDecodeError e faceva
          # fallire l'intero job DOPO che i dati erano gia' stati salvati e
          # committati: un allarme falso che nasconde i fallimenti veri.
          # Ora il deploy non confermato e' un warning, non un errore.
          RESP=$(curl -s -m 60 -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://api.render.com/v1/services/srv-d92cpfm7r5hc73fe07ig/deploys" || true)
          DEPLOY_ID=$(echo "$RESP" | sed -n 's/.*"id"[: ]*"\([^"]*\)".*/\1/p' | head -1)
          if [ -n "$DEPLOY_ID" ]; then
            echo "Deploy Render avviato: $DEPLOY_ID"
          else
            echo "::warning::Render non ha confermato il deploy. Risposta: $(echo "$RESP" | head -c 200)"
          fi
