name: StatIppica — Genealogia stalloni esteri

# QUESTO FLUSSO ERA RIMASTO "(test)" E NON AVEVA NESSUN ORARIO.
#
# Riempie la genealogia degli stalloni esteri, quella che il sito usa quando
# deve mostrare i nonni di un cavallo il cui padre o madre non e' italiano.
# Essendo senza orario non e' mai partito da solo: al 23 settembre i dati
# erano fermi al 2 luglio, tre mesi di genealogia vecchia mostrata come
# attuale, senza nessun errore da nessuna parte. Nessuno se ne sarebbe accorto
# perche' la pagina funziona lo stesso: mostra solo dati piu' vecchi.
#
# Ora gira ogni lunedi' alle 03:40 UTC, subito dopo il catalogo stalloni delle
# 03:10, cosi' se il catalogo ha aggiunto stalloni nuovi la genealogia li
# prende nello stesso giro. I valori predefiniti sono quelli veri (300 record,
# salvataggio attivo) e non piu' quelli da prova.

on:
  schedule:
    - cron: "40 3 * * 1"
  workflow_dispatch:
    inputs:
      limit:
        description: "Quanti record trattare per fase"
        required: false
        default: "300"
      no_push:
        description: "Non salvare su GitHub (solo prova, true/false)"
        required: false
        default: "false"
jobs:
  fill-pedigree:
    name: Esegui fill_pedigree.py
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installa dipendenze
        run: pip install requests beautifulsoup4
      - name: Esegui fill_pedigree.py
        env:
          DB_PATH: data.db
          REPO_DB_PATH: data.db
          GITHUB_TOKEN: ${{ secrets.GH_NIGHTLY_TOKEN }}
          GITHUB_USER: matteopetracca6-bit
          GITHUB_REPO: statippica
        run: |
          # Quando parte dall'orario gli input sono vuoti: senza un valore di
          # ripiego il comando diventa "--limit" senza numero e fallisce.
          LIMITE="${{ inputs.limit }}"
          ARGS="--limit ${LIMITE:-300}"
          if [ "${{ inputs.no_push }}" = "true" ]; then
            ARGS="$ARGS --no-push"
          fi
          echo "Eseguo: python fill_pedigree.py $ARGS"
          python fill_pedigree.py $ARGS
      - name: Trigger deploy Render (solo se ha salvato davvero)
        if: success() && inputs.no_push != 'true'
        run: |
          sleep 15
          # La risposta di Render non e' sempre JSON (errore HTML, rate limit, 5xx).
          # Con json.load diretto il passo andava in JSONDecodeError e faceva
          # fallire l'intero job DOPO che i dati erano gia' stati salvati e
          # committati: un allarme falso che nasconde i fallimenti veri.
          # Ora il deploy non confermato e' un warning, non un errore.
          RESP=$(curl -s -m 60 -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://api.render.com/v1/services/srv-d92cpfm7r5hc73fe07ig/deploys" || true)
          DEPLOY_ID=$(echo "$RESP" | sed -n 's/.*"id"[: ]*"\([^"]*\)".*/\1/p' | head -1)
          if [ -n "$DEPLOY_ID" ]; then
            echo "Deploy Render avviato: $DEPLOY_ID"
          else
            echo "::warning::Render non ha confermato il deploy. Risposta: $(echo "$RESP" | head -c 200)"
          fi
