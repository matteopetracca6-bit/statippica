name: TEMPORANEO — togli dipendenze inutili

on:
  push:
    branches: [pulizia/codice]

permissions:
  contents: write

jobs:
  togli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Togli lo script e la regola di drizzle-kit e aggiorna il package-lock
        run: |
          npm pkg delete scripts.db:push overrides
          npm install --package-lock-only --no-audit --no-fund
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Dipendenze: tolti lo script db:push e la regola overrides di drizzle-kit" || echo "niente da cambiare"
          git push
