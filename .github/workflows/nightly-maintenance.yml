name: StatIppica — Nightly Maintenance (aggiorna e colma buchi cavalli esistenti)
on:
  # Ogni notte alle 01:30 UTC — un'ora dopo il job "Results", per non litigare sul push
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Motivo del trigger manuale"
        required: false
        default: "trigger manuale"
jobs:
  nightly-maintenance:
    name: Esegui nightly_update.py (mode=maintenance)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installa dipendenze
        run: pip install requests beautifulsoup4
      - name: Procura l'archivio
        # Lo scarica dal rilascio e verifica il numero di gare. Se non torna,
        # si ferma: lavorare senza archivio lo farebbe ricreare vuoto e
        # pubblicare al posto di quello vero. La logica sta in un solo script
        # perche' la usano tutti e quattro i lavori automatici.
        run: bash scripts/ottieni_archivio.sh
      - name: Esegui nightly_update.py (maintenance)
        env:
          NIGHTLY_MODE: maintenance
          DB_PATH: data.db
          REPO_DB_PATH: data.db
          GITHUB_TOKEN: ${{ secrets.GH_NIGHTLY_TOKEN }}
          GITHUB_USER: matteopetracca6-bit
          GITHUB_REPO: statippica
          ACTIVE_UPDATE_BATCH_SIZE: "800"
          BACKFILL_BATCH_SIZE: "150"
          # FASE 2c (copertura genitori): UNIRE ora attivo (unire_source.py).
          # 300 genitori/notte a 2 richieste per genitore con 1s pausa ≈ 12 min.
          PARENT_COVERAGE_BATCH_SIZE: "300"
          # Recupero date mancanti: col lettore nuovo ogni cavallo raggiungibile
          # rende, quindi vale la pena smaltire in fretta gli 8.714 arretrati.
          UNDATED_BATCH_SIZE: "2000"
          # Seconda fonte (VendoPuledri): genealogia a 5 generazioni e incroci.
          # ~1,3 s a cavallo, quindi 1200 sono circa 25 minuti; restano
          # ~5.600 cavalli arretrati, smaltiti in meno di una settimana.
          VP_PEDIGREE_BATCH_SIZE: "1200"
          VP_SIRES_PER_NIGHT: "10"
        run: python nightly_update.py
      - name: Trigger deploy Render dopo aggiornamento DB
        if: success()
        run: |
          # Pausa breve: da' tempo al webhook GitHub->Render di arrivare, altrimenti
          # Render puo' deployare l'ultimo commit che conosceva PRIMA di questo push
          # (race condition osservata: deploy sull'commit precedente, non quello nuovo)
          sleep 15
          # La risposta di Render non e' sempre JSON (errore HTML, rate limit, 5xx).
          # Con json.load diretto il passo andava in JSONDecodeError e faceva
          # fallire l'intero job DOPO che i dati erano gia' stati salvati e
          # committati: un allarme falso che nasconde i fallimenti veri.
          # Ora il deploy non confermato e' un warning, non un errore.
          RESP=$(curl -s -m 60 -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://api.render.com/v1/services/srv-d92cpfm7r5hc73fe07ig/deploys" || true)
          DEPLOY_ID=$(echo "$RESP" | sed -n 's/.*"id"[: ]*"\([^"]*\)".*/\1/p' | head -1)
          if [ -n "$DEPLOY_ID" ]; then
            echo "Deploy Render avviato: $DEPLOY_ID"
          else
            echo "::warning::Render non ha confermato il deploy. Risposta: $(echo "$RESP" | head -c 200)"
          fi
