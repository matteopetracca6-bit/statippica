name: StatIppica — Togli i non partiti (a mano, una volta)

# Novembre 2026. Il recupero dalle pagine ufficiali aveva inserito come gare
# galoppate circa 19.000 cavalli ritirati prima del via (guidatore
# "A.rit. 09:30:00"). ripara_archivio.py li sposta nei non partiti e li toglie
# dalle gare. Le gare scendono di circa il 2,5%: la protezione della
# pubblicazione (al massimo -0,5%) qui si allenta apposta, una volta sola.
# Dalle notti seguenti il recupero non li inserisce piu' e la riparazione non
# trova niente.

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  togli:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Procura l'archivio
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ottieni_archivio.sh
      - name: Togli i non partiti
        run: |
          python3 scripts/ripara_archivio.py --db data.db
          python3 - <<'PY'
          import sqlite3, sys
          c = sqlite3.connect("data.db")
          resto = c.execute("SELECT COUNT(*) FROM races WHERE driver LIKE 'A.rit.%'").fetchone()[0]
          gare = c.execute("SELECT COUNT(*) FROM races").fetchone()[0]
          print(f"gare: {gare}; righe 'A.rit.' rimaste: {resto}")
          if resto or gare < 700000:
              print("::error::risultato inatteso: non pubblico."); sys.exit(1)
          PY
      - name: Pubblica l'archivio aggiornato
        env:
          GH_TOKEN: ${{ secrets.GH_NIGHTLY_TOKEN }}
          CONSENTI_CALO: "1"
        run: |
          set -euo pipefail
          gzip -9 -c data.db > data.db.gz
          bash scripts/pubblica_archivio.sh
      - name: Chiedi a Render di ripubblicare il sito
        if: ${{ success() }}
        run: |
          sleep 10
          curl -s -m 60 -X POST -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" -d '{}' \
            "https://api.render.com/v1/services/srv-d92cpfm7r5hc73fe07ig/deploys" | head -c 300; echo
