name: StatIppica — Corse degli storici da TrottoWeb (a mano)

# 19/11/2026 (scripts/storici_corse.py). Aggiunge le corse una per una che
# mancano agli storici di un'annata (prima: i nati nel 2011, a cui manca
# quasi meta' carriera, soprattutto il 2014-2015), leggendo la scheda
# TrottoWeb; poi aggiorna i totali di carriera (mai piu' bassi di quelli
# ufficiali), ricalcola voti e forza, pubblica l'archivio e ripubblica il sito.

on:
  workflow_dispatch:
    inputs:
      anno:
        description: "Annata di nascita (2011) o intervallo (2010-2003)"
        required: false
        default: "2011"
      minuti:
        description: "Minuti di lettura"
        required: false
        default: "150"
      ripristina:
        description: "Rimetti i totali UNIRE ai nati fino a quest'anno (vuoto = no)"
        required: false
        default: ""
      prova:
        description: "Solo prova su 20 cavalli, senza pubblicare"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: read

jobs:
  corse:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4 numpy pandas scikit-learn
      - name: Procura l'archivio
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ottieni_archivio.sh
      - name: Leggi le schede TrottoWeb
        run: |
          if [ "${{ inputs.prova }}" = "true" ]; then
            python3 scripts/storici_corse.py --db data.db --anno "${{ inputs.anno }}" --massimo 20 --prova
          else
            python3 scripts/storici_corse.py --db data.db --anno "${{ inputs.anno }}" --minuti "${{ inputs.minuti }}" --totali ${{ inputs.ripristina && format('--ripristina {0}', inputs.ripristina) || '' }}
          fi
      - name: Ricalcola voti e forza
        if: ${{ inputs.prova != true }}
        env:
          DB_PATH: data.db
        run: |
          python3 - <<'PY'
          import importlib.util, sqlite3
          spec = importlib.util.spec_from_file_location("nu", "nightly_update.py")
          nu = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(nu)
          conn = sqlite3.connect("data.db")
          nu.init_db(conn)
          conn.commit()
          nu.phase_ratings(conn)
          nu.phase_historic_ratings(conn)
          nu.phase_stallion_ratings(conn)
          nu.phase_dam_ratings(conn)
          conn.commit()
          import forza
          forza.calcola(conn)
          conn.close()
          PY
      - name: Pubblica l'archivio aggiornato
        if: ${{ inputs.prova != true }}
        env:
          GH_TOKEN: ${{ secrets.GH_NIGHTLY_TOKEN }}
        run: |
          set -euo pipefail
          GARE=$(python3 -c "import sqlite3;print(sqlite3.connect('data.db').execute('select count(*) from races').fetchone()[0])")
          if [ "$GARE" -lt 500000 ]; then echo "::error::solo $GARE gare: non lo pubblico."; exit 1; fi
          gzip -9 -c data.db > data.db.gz
          bash scripts/pubblica_archivio.sh
      - name: Chiedi a Render di ripubblicare il sito
        if: ${{ success() && inputs.prova != true }}
        run: |
          sleep 10
          curl -s -m 60 -X POST -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" -d '{}' \
            "https://api.render.com/v1/services/srv-d92cpfm7r5hc73fe07ig/deploys" | head -c 300; echo
