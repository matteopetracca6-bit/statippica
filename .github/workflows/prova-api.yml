name: PROVA — api verifica
on:
  push:
    branches: [prova/api-verifica]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://statippica.onrender.com
          for k in 1 2 3; do
            curl -s -o /dev/null -w "home %{http_code} %{time_total}s\n" $B/api/stats
            for m in "ONE DREAM GRIF" "LOVE ME TENDER" "OGRAZIA"; do
              curl -s -D /tmp/h -o /tmp/a.json -w "advisor %{http_code} %{time_total}s %{size_download}B $m\n" -H 'content-type: application/json' -d "{\"fattrice\":\"$m\"}" $B/api/advisor; grep -i server-timing /tmp/h || head -c 300 /tmp/a.json
            done
            curl -s -o /dev/null -w "scheda %{http_code} %{time_total}s\n" "$B/api/horse/VIVID%20WISE%20AS/2014"
          done
          python3 -c "
          import json;d=json.load(open('/tmp/a.json'));c=d.get('candidates',[]);print(len(c), sum(1 for x in c if x.get('potenziale')), 'con potenziale', c[0].get('potenziale') if c else None)"
