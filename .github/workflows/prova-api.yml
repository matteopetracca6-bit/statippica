name: PROVA — api verifica
on:
  push:
    branches: [prova/api-verifica]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://statippica.onrender.com
          for dv in italia misto solo_estero ospiti; do
            for n in "DJANGO%20RIFF" "FACE%20TIME%20BOURBON" "DON%20FANUCCI"; do
              curl -s "$B/api/leaderboard?mode=performance&dove=$dv&q=$n" | python3 -c "import json,sys;d=json.load(sys.stdin);print('$dv $n', d['total'])"
            done
          done
