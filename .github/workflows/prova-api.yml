name: PROVA — api verifica
on:
  push:
    branches: [prova/api-verifica]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
          for u in "https://www.letrot.com/" "https://www.letrot.com/stats/recherche?q=face+time+bourbon" "https://www.letrot.com/recherche?q=face+time+bourbon" "https://www.letrot.com/stats/fiche-cheval/face-time-bourbon" "https://fr.wikipedia.org/wiki/Face_Time_Bourbon" "https://www.equidia.fr/chevaux/face-time-bourbon" "https://www.turf-fr.com/recherche?q=face+time+bourbon"; do
            code=$(curl -sL -A "$UA" -o /tmp/p.html -w "%{http_code} %{url_effective}" "$u"); echo "== $u -> $code $(wc -c </tmp/p.html)"
            grep -oE 'href="[^"]*(fiche-cheval|chevaux|cheval)[^"]*"' /tmp/p.html | sort -u | head -8
            grep -oiE '(api|graphql)[^" ]{0,80}' /tmp/p.html | sort -u | head -5
          done
          curl -sL -A "$UA" "https://fr.wikipedia.org/w/index.php?title=Face_Time_Bourbon&action=raw" | head -c 6000
