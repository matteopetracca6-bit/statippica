name: PROVA — api verifica
on:
  push:
    branches: [prova/api-verifica]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install requests beautifulsoup4 >/dev/null
      - run: |
          python3 - <<'PY'
          import sys; sys.path.insert(0,'.'); sys.path.insert(0,'scripts')
          import storici_unire as su
          for anno in (2025, 2024):
              for sesso in ("M","F"):
                  for t in ("", "M", "A", "MA"):
                      try:
                          n, righe = su.cerca(t, sesso, anno)
                          print("UNIRE", anno, sesso, repr(t), n, len(righe), righe[:2])
                      except Exception as e:
                          print("UNIRE", anno, sesso, repr(t), "errore", e)
          PY
