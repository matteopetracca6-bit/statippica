name: PROVA — api verifica
on:
  push:
    branches: [prova/api-verifica]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://statippica.onrender.com
          t() { curl -s -o /tmp/r.json -w "%{http_code} %{time_total}s %{size_download}B  $1\n" "$B$1"; }
          for giro in freddo caldo; do
            echo "== $giro"
            for h in "VIVID%20WISE%20AS/2014" "GINOSTRABLIGGI/2022" "ONE%20DREAM%20GRIF/0"; do
              t "/api/horse/$h"; t "/api/horse/$h/stats"; t "/api/horse/$h/neighbors"
            done
            n=$(echo "VIVID WISE AS" | sed 's/ /%20/g'); t "/api/horse-trainers/$n"; t "/api/horse-owners/$n"; t "/api/pedigree/$n"
          done
          for m in "ONE DREAM GRIF" "LOVE ME TENDER"; do
            curl -s -o /tmp/a.json -w "advisor %{http_code} %{time_total}s %{size_download}B $m\n" -H 'content-type: application/json' -d "{\"fattrice\":\"$m\"}" $B/api/advisor
            python3 -c "
          import json;d=json.load(open('/tmp/a.json'))
          c=d.get('candidates',[]);print(len(c),'cand', d.get('in_catalogo'), d.get('esclusi'), d.get('incroci'))
          for x in c[:6]: print(' ',x['name'],x.get('stud_fee_eur'),x.get('prob_buono'),x.get('inbreeding_pct'),x.get('country'),x.get('incrocio'),x.get('fratelli'))
          print(' senza monta', sum(1 for x in c if not x.get('stud_fee_eur')), 'giovani', sum(1 for x in c if not x.get('n_figli_totali')))"
          done
