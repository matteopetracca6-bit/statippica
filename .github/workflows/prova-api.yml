name: PROVA — api verifica
on:
  push:
    branches: [prova/api-verifica]
permissions:
  contents: write
jobs:
  allena:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        modo: [rank, km, residui, carriera]
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q xgboost==2.1.3 scikit-learn pandas numpy
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api repos/${{ github.repository }}/releases/tags/archivio --jq '.assets[] | select(.name=="data.db.gz") | .id')
          gh api -H "Accept: application/octet-stream" repos/${{ github.repository }}/releases/assets/$id > data.db.gz
          gunzip -f data.db.gz
      - run: |
          set +e
          mkdir -p out
          if [ "${{ matrix.modo }}" = "carriera" ]; then
            NTHREAD=4 python3 carriera_futura.py --allena > out/log.txt 2>&1
            cp modelli/carriera_*.json out/ 2>/dev/null
          else
            NTHREAD=4 python3 prova/xgb4.py ${{ matrix.modo }} 2>&1 | grep -v "^\[[0-9]*\]\s*v-" > out/log.txt
          fi
          grep -E "ESITO|Error|error|Traceback" out/log.txt | cut -c1-3000; tail -30 out/log.txt
      - if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd out && git init -q && git config user.email "prova@statippica.bot" && git config user.name "Prova"
          git add -A && git commit -q -m "esperimento ${{ matrix.modo }}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" HEAD:refs/heads/esperimento-${{ matrix.modo }} && echo spinto
