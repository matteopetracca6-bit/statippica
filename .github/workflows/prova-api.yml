name: PROVA — api verifica
on:
  push:
    branches: [prova/api-verifica]
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - run: |
          B=https://statippica.onrender.com
          for i in $(seq 1 80); do
            curl -s "$B/api/horse/FACE%20TIME%20BOURBON/2015" -o /tmp/h.json
            curl -s "$B/api/leaderboard?mode=performance&dove=misto&limit=1" -o /tmp/m.json
            python3 -c "import json,sys;d=json.load(open('/tmp/h.json'));m=json.load(open('/tmp/m.json'));sys.exit(0 if d.get('grade')=='SSS' and d.get('ospite_estero') and m.get('total') else 1)" && break; sleep 30
          done; echo "pronto dopo $i"
          for h in "FACE%20TIME%20BOURBON/2015" "DON%20FANUCCI%20ZET%20(S)/2016" "GO%20ON%20BOY%20(F)/2016" "DJANGO%20RIFF/2013"; do
            curl -s "$B/api/horse/$h" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('name'),d.get('grade'),d.get('score'),d.get('pos_annata'),'/',d.get('tot_annata'),'ospite',d.get('ospite_estero'),'IT',d.get('gare_italia'),'EST',d.get('gare_estero'))"
          done
          for dv in "" italia misto estero solo_estero ospiti senza_ospiti; do
            curl -s "$B/api/leaderboard?mode=performance&dove=$dv&limit=50" | python3 -c "import json,sys;d=json.load(sys.stdin);r=d['rows'];print('$dv'.ljust(13),d['total'],'DJANGO RIFF' in [x['name'] for x in r] and 'django in prima pagina' or '', [x['name']+('*' if x.get('ospite_estero') else '') for x in r[:4]])"
          done
          for dv in italia misto solo_estero; do
            curl -s "$B/api/leaderboard?mode=performance&dove=$dv&cerca=DJANGO%20RIFF" | python3 -c "import json,sys;d=json.load(sys.stdin);print('DJANGO RIFF in $dv:',d['total'])"
          done
