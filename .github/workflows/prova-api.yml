name: PROVA — api verifica
on:
  push:
    branches: [prova/api-verifica]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for v in SEK USD; do
            curl -s "https://data-api.ecb.europa.eu/service/data/EXR/A.$v.EUR.SP00.A?format=csvdata" | python3 -c "
          import csv,sys; r=list(csv.DictReader(sys.stdin)); print('$v', {x['TIME_PERIOD']: round(float(x['OBS_VALUE']),4) for x in r})"
          done
