name: PROVA — api verifica
on:
  push:
    branches: [prova/api-verifica]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
          echo "== travsport"
          for n in "READLY%20EXPRESS" "MANOFMANYMISSIONS" "NAPOLEON"; do
            curl -s -A "$UA" -H "Accept: application/json" "https://api.travsport.se/webapi/horses/search/organisation/TROT?age=0&gender=BOTH&horseName=$n&trotBreed=ALL&autoSuffixWildcard=false" | head -c 700; echo
          done
          echo "== letrot con cookie"
          curl -s -c /tmp/j -b /tmp/j -A "$UA" -o /dev/null https://www.letrot.com/
          for p in "search/horse/ready%20cash" "search/fuzzy/ready%20cash" "search/horse/ready-cash"; do
            curl -s -c /tmp/j -b /tmp/j -A "$UA" -H "Accept: application/json, text/plain, */*" -H "X-Requested-With: XMLHttpRequest" -H "Referer: https://www.letrot.com/" -w " [%{http_code}]" "https://www.letrot.com/v1/api/$p" | head -c 700; echo
          done
          echo "== stdbred canada"
          curl -s -A "$UA" -w " [%{http_code}]" "https://standardbredcanada.ca/horse-search?name=manofmanymissions" | grep -oE 'href="[^"]*horse[^"]*"' | head -5
