name: PROVA — api verifica
on:
  push:
    branches: [prova/api-verifica]
jobs:
  esperimento:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variante: [v4, ind, h2h, f30, tutte, tutte_ferri, vince]
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q xgboost==2.1.3 scikit-learn pandas numpy
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api repos/${{ github.repository }}/releases/tags/archivio --jq '.assets[] | select(.name=="data.db.gz") | .id')
          gh api -H "Accept: application/octet-stream" repos/${{ github.repository }}/releases/assets/$id > data.db.gz
          gunzip -f data.db.gz
      - run: python3 prova/esperimento.py ${{ matrix.variante }}
      - if: matrix.variante == 'vince'
        uses: actions/upload-artifact@v4
        with: { name: vince, path: vince_prova.json }
