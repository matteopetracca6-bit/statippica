name: PROVA — api verifica
on:
  push:
    branches: [prova/api-verifica]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://statippica.onrender.com
          sleep 780; echo "nuovo deploy pronto"
          for giro in 1 2 3; do
            for h in "VIVID%20WISE%20AS/2014" "GINOSTRABLIGGI/2022" "FRAGOLINO%20ROSSO%20(D)/2022"; do
              curl -s -D /tmp/h -o /dev/null -w "%{http_code} %{time_total}s $h\n" "$B/api/horse/$h"; grep -i server-timing /tmp/h || true
            done
          done
          for m in "ONE DREAM GRIF" "LOVE ME TENDER" "ONE DREAM GRIF"; do
            curl -s -o /tmp/a.json -w "advisor %{http_code} %{time_total}s %{size_download}B $m\n" -H 'content-type: application/json' -d "{\"fattrice\":\"$m\"}" $B/api/advisor
          done
          python3 -c "
          import json;d=json.load(open('/tmp/a.json'));c=d['candidates'];print(len(c), sum(1 for x in c if x.get('potenziale')), 'con potenziale')"
