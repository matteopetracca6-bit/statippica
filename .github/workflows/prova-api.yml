name: PROVA — api verifica
on:
  push:
    branches: [prova/api-verifica]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://statippica.onrender.com
          curl -s "$B/api/home/sorprese" | python3 -c "
          import json,sys;d=json.load(sys.stdin);print('corse',d.get('corse'),'sorprese',d.get('n_sorprese'),'delusioni',d.get('n_delusioni'))
          for k in ('sorprese','delusioni'):
              for v in d[k][:3]: print(' ',k,v['nome'],v['quota'],v['data'],v['pista'],v.get('arrivo'),v['motivi'])"
