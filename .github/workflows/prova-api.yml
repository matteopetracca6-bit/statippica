name: PROVA — api verifica
on:
  push:
    branches: [prova/api-verifica]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
          B=https://api.travsport.se/webapi
          for u in "horses/search/organisation/TROT?horseName=READLY%20EXPRESS" "horses/search/organisation/TROT/sourceofdata/SPORT?horseName=READLY%20EXPRESS" "horses/search?horseName=READLY%20EXPRESS" "search/horses/organisation/TROT?name=READLY%20EXPRESS" "horses/search/organisation/TROT?age=0&gender=BOTH&horseName=READLY%20EXPRESS&trotBreed=ALL&autoSuffixWildcard=true" "horses/organisation/TROT/search?name=READLY%20EXPRESS"; do
            sleep 4; echo "== $u"; curl -s -A "$UA" -H "Accept: application/json" -w " [%{http_code}]" "$B/$u" | head -c 400; echo
          done
          sleep 4; curl -s -A "$UA" -o /tmp/s.html "https://sportapp.travsport.se/"; grep -oE '/(static|assets)/[^"]+\.js' /tmp/s.html | head -5
