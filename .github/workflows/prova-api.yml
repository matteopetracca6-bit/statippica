name: PROVA — api verifica
on:
  push:
    branches: [prova/api-verifica]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api repos/${{ github.repository }}/releases/tags/archivio --jq '.assets[] | select(.name=="data.db.gz") | .id')
          gh api -H "Accept: application/octet-stream" repos/${{ github.repository }}/releases/assets/$id > data.db.gz
          gunzip -f data.db.gz
      - run: python3 prova/conta_manti.py > conta.txt; cat conta.txt
      - run: |
          set +e
          npm i playwright@1.49.1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 - <<'PY' > esempio.txt
          import re; t = open("conta.txt").read(); m = re.search(r"ESEMPI \[\('([^']+)', (\d+)", t); print(m.group(1) if m else "SABA DEL RONCO", m.group(2) if m else 2011)
          PY
          node prova/manto.cjs $(cat esempio.txt | cut -d' ' -f1- | sed 's/ \([0-9]*\)$/|\1/' | tr '|' '\n' | head -1 | sed 's/^/"/;s/$/"/' | xargs echo) $(awk '{print $NF}' esempio.txt)
          node prova/manto.cjs "SABA DEL RONCO" 2011
