name: PROVA — api verifica
on:
  push:
    branches: [prova/api-verifica]
jobs:
  simulatore:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variante: [base, piste, inc13, inc24, spunto10, spunto04, solo_piste, solo_base]
    steps:
      - uses: actions/checkout@v4
      - run: npm i tsx@4.19.2 >/dev/null 2>&1; VARIANTE=${{ matrix.variante }} npx tsx prova/sim2.ts
  partenza:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s "https://www.trottoweb.it/TrottoWeb/php_resp/hPart.php" -o h.html; wc -c h.html
          grep -o -i ".\{60\}\(autostart\|auto-start\|nastri\|partenza\).\{60\}" h.html | head -20
          curl -s "https://www.trottoweb.it/TrottoWeb/php_resp/hNum.php" | grep -o 'href="[^"]*"' | head -5
