name: PROVA — api verifica
on:
  push:
    branches: [prova/api-verifica]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
          for f in app.0c30b946 458.9ca2ab0d 566.dcdbe4b1 669.3a42bd68 721.fd59b202 73.77bd4f4d 762.90221c66 802.25a91b3e 843.a1296e73 961.c046c14d 968.1fe2af21; do
            curl -sL -A "$UA" -o /tmp/$f.js "https://www.letrot.com/build/$f.js"
            echo "== $f $(wc -c </tmp/$f.js)"
            grep -oE '["'"'"'`][^"'"'"'` ]*(json|api|ajax|stats/|courses|performances)[^"'"'"'` ]*["'"'"'`]' /tmp/$f.js | sort -u | head -25
          done
          curl -sL -A "$UA" -o /tmp/p.html "https://www.letrot.com/stats/chevaux/face-time-bourbon/ZWdbYgYIBAsM/courses"
          grep -oE '(href|data-[a-z-]+)="[^"]*ZWdbYgYIBAsM[^"]*"' /tmp/p.html | sort -u
