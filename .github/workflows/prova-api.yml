name: PROVA — api verifica
on:
  push:
    branches: [prova/api-verifica]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
          curl -sL -A "$UA" -o /tmp/p.html "https://www.letrot.com/stats/chevaux/face-time-bourbon/ZWdbYgYIBAsM/courses"
          python3 - <<'PY'
          import re,html
          s=open('/tmp/p.html',encoding='utf-8',errors='ignore').read()
          for m in re.finditer(r'mtapi',s):
              print('CTX', s[max(0,m.start()-400):m.start()+400].replace('\n',' '))
          t=re.sub(r'<script.*?</script>|<style.*?</style>','',s,flags=re.S)
          t=html.unescape(re.sub(r'<[^>]+>',' ',t)); t=re.sub(r'\s+',' ',t)
          i=t.find('Records absolus'); print('DOPO', t[i:i+4000])
          for m in re.finditer(r'<table[^>]*>',s): print('TABLE', m.group(0)[:200])
          for m in re.finditer(r'data-[a-z\-]+="[^"]{3,120}"',s): pass
          print('DATA', sorted(set(re.findall(r'data-(?:url|href|src|api|route)[a-z\-]*="[^"]+"',s)))[:30])
          print('JS', sorted(set(re.findall(r'src="([^"]+\.js[^"]*)"',s)))[:20])
          PY
