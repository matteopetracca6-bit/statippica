name: PROVA — api verifica
on:
  push:
    branches: [prova/api-verifica]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
          curl -sL -A "$UA" -o /tmp/p.html "https://www.letrot.com/stats/chevaux/face-time-bourbon/ZWdbYgYIBAsM/courses"
          grep -oE '(api-uri|apiuri|:api-uri|api_uri)="[^"]*"' /tmp/p.html | sort -u | head
          grep -oE '/v1/api/[^"&<> ]*' /tmp/p.html | sort -u | head -20
          for u in /v1/api/horses/ZWdbYgYIBAsM/performances /v1/api/horses/ZWdbYgYIBAsM/races /v1/api/horses/ZWdbYgYIBAsM; do
            echo "== $u"; curl -sL -A "$UA" -H "Accept: application/json" -H "X-Requested-With: XMLHttpRequest" -H "Referer: https://www.letrot.com/stats/chevaux/face-time-bourbon/ZWdbYgYIBAsM/courses" "https://www.letrot.com$u" | head -c 1500; echo
          done
