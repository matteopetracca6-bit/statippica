name: PROVA — api verifica
on:
  push:
    branches: [prova/api-verifica]
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - run: |
          npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          node audit.mjs
