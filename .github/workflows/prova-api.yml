name: PROVA — api verifica
on:
  push:
    branches: [prova/api-verifica]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://statippica.onrender.com
          for i in $(seq 1 70); do
            curl -s -D /tmp/h -o /dev/null -H 'content-type: application/json' -d '{"fattrice":"LOVE ME TENDER"}' $B/api/advisor
            grep -qi "server-timing" /tmp/h && break; sleep 20
          done
          echo "nuovo deploy dopo $i"; sleep 30
          for m in "ONE DREAM GRIF" "LOVE ME TENDER" "ONE DREAM GRIF" "LOVE ME TENDER"; do
            curl -s -D /tmp/h -o /tmp/a.json -w "advisor %{http_code} %{time_total}s %{size_download}B $m\n" -H 'content-type: application/json' -d "{\"fattrice\":\"$m\"}" $B/api/advisor; grep -i server-timing /tmp/h
          done
          python3 -c "
          import json;d=json.load(open('/tmp/a.json'));c=d['candidates'];print(len(c), sum(1 for x in c if x.get('potenziale')), 'con potenziale', c[0].get('potenziale'))"
