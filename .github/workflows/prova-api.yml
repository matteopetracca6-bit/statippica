name: PROVA — api verifica
on:
  push:
    branches: [prova/api-verifica]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
          curl -sL -A "$UA" -o /tmp/app.js "https://www.letrot.com/build/app.0c30b946.js"
          python3 - <<'PY'
          import re
          s=open('/tmp/app.js',encoding='utf-8',errors='ignore').read()
          for k in ['apiUriHorse:function','apiUriResult:function','apiUriFilterPerformances','"/api/','/v1/','performances/','api.letrot','baseURL','apiUrl','API_URL']:
              for m in list(re.finditer(re.escape(k),s))[:3]:
                  print('K',k,'::',s[max(0,m.start()-150):m.start()+350].replace('\n',' '))
          print('HOSTS', sorted(set(re.findall(r'https?://[a-z0-9.\-]+\.(?:fr|com|net|io)[^"\' ]{0,40}',s)))[:40])
          PY
