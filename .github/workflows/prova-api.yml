name: PROVA — api verifica
on:
  push:
    branches: [prova/api-verifica]
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - run: |
          B=https://statippica.onrender.com
          for i in $(seq 1 70); do
            curl -s "$B/api/horse/FACE%20TIME%20BOURBON/2015" -o /tmp/h.json
            python3 -c "import json,sys;d=json.load(open('/tmp/h.json'));sys.exit(0 if d.get('gare_estero') else 1)" && break; sleep 30
          done; echo "pronto dopo $i"
          for h in "FACE%20TIME%20BOURBON/2015" "READY%20CASH/2005" "BIRD%20PARKER/2011" "DIJON/2013"; do
            curl -s "$B/api/horse/$h" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('name'),d.get('grade'),d.get('score'),d.get('career_races'),'IT',d.get('gare_italia'),d.get('guad_italia'),'EST',d.get('gare_estero'),d.get('vitt_estero'),d.get('guad_estero'),'forza',d.get('forza'),'redirect',d.get('vai_a_pagina'))"
          done
