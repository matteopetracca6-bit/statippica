name: PROVA — parziali UNIRE
on:
  push:
    branches: [feature/parziali-complete]
permissions:
  contents: read
  actions: read
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4
      - name: Procura l'archivio
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ottieni_archivio.sh
      - run: python3 scripts/storici_unire.py --db data.db --minuti 6 --prova
      - name: Prova diretta su POP HEART e MAN DI CASEI
        run: |
          python3 - <<'PY'
          import sqlite3, sys
          sys.path.insert(0, "scripts"); import storici_unire as S
          src = sqlite3.connect("data.db"); c = sqlite3.connect(":memory:"); src.backup(c)
          S.crea_tabelle(c)
          for nome in ("POP HEART", "MAN DI CASEI"):
              n, a, s = c.execute("SELECT name, birth_year, sex FROM horses WHERE name = ?", (nome,)).fetchone()
              print(nome, S.cerca_parziale(c, n, a, s))
              r = c.execute("SELECT id_cav, nome, sesso, anno, padre, madre FROM storici_unire_cavalli WHERE nome = ?", (nome,)).fetchone()
              if r: print("  scheda:", S.leggi_cavallo(c, *r))
              print("  ", c.execute("SELECT name, birth_year, sex, career_races, career_wins, career_earnings, record_career, source FROM horses WHERE name = ?", (nome,)).fetchone())
          PY
